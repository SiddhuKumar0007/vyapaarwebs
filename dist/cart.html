<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shopping Cart & Website Packages — VyapaarWebs</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #09090f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .cart-card {
      max-width: 540px;
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .brand-logo-img {
      width: 56px;
      height: 56px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 26px;
      margin-bottom: 12px;
    }
    p {
      color: rgba(255, 255, 255, 0.7);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      padding: 14px 32px;
      border-radius: 999px;
      background: #7c3aed;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="cart-card">
    <img src="assets/logo.png" alt="VyapaarWebs" class="brand-logo-img">
    <h1>Your Website Selection</h1>
    <p>Selected package: Custom Responsive Business Website. Proceed to checkout to finalize scope with our design team.</p>
    <a href="/checkout" class="btn">Proceed to Checkout →</a>
  </div>
</body>
</html>
